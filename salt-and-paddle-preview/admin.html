<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#173241">
<style>
/* =====================================================================
   SALT & PADDLE — shared glass design system
   Included by Booking, Admin (and later Status / Confirm / Owner) with
   <?!= include('Styles') ?>
   Change the brand by editing the tokens below only.
   ===================================================================== */
:root{
  --ink:#173241; --ink-2:#4A4F5C; --muted:#6A7A80;
  /* brand = the existing theme: mauve-navy #4E4A52 + rose #B05D78 + blush #FBF2F5 */
  --navy:#4E4A52; --navy-d:#39363D;
  --brand:#B05D78; --brand-2:#4E4A52; --brand-d:#8F4760;
  --blue:#3F76A8;
  --sand:#D79AAE; --sand-d:#B05D78;
  --glass:rgba(255,255,255,.58); --glass-2:rgba(255,255,255,.82); --glass-edge:rgba(255,255,255,.8);
  --line:rgba(23,50,65,.10); --line-2:rgba(23,50,65,.18);
  --ok-bg:rgba(34,170,120,.15); --ok-ink:#3F6B2E;
  --bad-bg:rgba(226,92,92,.15); --bad-ink:#A8443D;
  --warn-bg:rgba(240,176,60,.22); --warn-ink:#8A5E0E;
  --past-bg:rgba(23,50,65,.05); --past-ink:#9AA6AD;
  --r-lg:26px; --r-md:18px; --r-sm:13px;
  --shadow:0 18px 44px -16px rgba(57,54,61,.30),0 2px 6px rgba(23,50,65,.05);
  --ease:cubic-bezier(.22,.9,.28,1);
  --grad:linear-gradient(135deg,#6B6572 0%,#39363D 100%);
  --grad-sel:linear-gradient(135deg,#5B96C8 0%,#3F76A8 100%);
  --serif:'Playfair Display',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--ink);overflow-x:hidden;
  font:500 15px/1.5 'Manrope',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(1100px 700px at 6% -8%,#F7D5E0 0%,transparent 60%),
    radial-gradient(900px 620px at 100% 2%,#EADFF0 0%,transparent 55%),
    radial-gradient(1000px 800px at 50% 112%,#F3D2DD 0%,transparent 60%),
    #FBF2F5;
  background-attachment:fixed;
}
/* floating light orbs behind the glass */
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(72px);opacity:.55;pointer-events:none;will-change:transform}
body::before{width:46vmax;height:46vmax;left:-14vmax;top:16vh;background:radial-gradient(circle at 30% 30%,#D98CA4,rgba(217,140,164,0) 70%);animation:drift 22s ease-in-out infinite alternate}
body::after{width:40vmax;height:40vmax;right:-12vmax;bottom:-8vmax;background:radial-gradient(circle at 60% 40%,#B9A9CC,rgba(185,169,204,0) 70%);animation:drift 28s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate3d(6vmax,-5vmax,0) scale(1.15)}}

h1,h2,h3{margin:0;letter-spacing:-.01em}
h1,h2{font-family:var(--serif);font-weight:600}
h3{font-size:16px;font-weight:800}
.sub{color:var(--muted);font-size:13px;margin:4px 0 12px}
button{font-family:inherit}

/* ---------- icons ---------- */
.i{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}

/* ---------- glass surfaces ---------- */
.glass,.card{
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid var(--glass-edge);border-radius:var(--r-lg);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.card{background:rgba(255,255,255,.94)}}
.card{padding:22px;margin-top:16px;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}

/* ---------- motion helpers ---------- */
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fx{animation:rise .6s var(--ease) both}
.fx.d1{animation-delay:.06s}.fx.d2{animation-delay:.12s}.fx.d3{animation-delay:.18s}.fx.d4{animation-delay:.24s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* ---------- top navigation ---------- */
.nav{position:sticky;top:12px;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px 10px 10px;border-radius:999px;background:rgba(255,255,255,.62)}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;background:#fff;border:2px solid #fff;box-shadow:0 4px 14px -4px rgba(23,50,65,.35)}
.logo.svg{display:flex;align-items:center;justify-content:center;background:var(--grad);color:#fff}
.logo.svg .i{width:24px;height:24px}
.wordmark{min-width:0}
.wordmark b{display:block;font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark span{display:block;font-size:9.5px;letter-spacing:.26em;color:var(--sand-d);font-weight:800;margin-top:3px}
.steps{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:7px;padding:5px 10px 5px 5px;border-radius:99px;font-size:11.5px;font-weight:700;color:var(--muted);transition:all .4s var(--ease)}
.steps li i{font-style:normal;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;background:rgba(23,50,65,.07);transition:all .4s var(--ease)}
.steps li span{display:none}
.steps li.on{background:var(--ink);color:#fff}
.steps li.on span{display:inline}
.steps li.on i{background:var(--grad);color:#fff}
.steps li.done i{background:var(--ok-bg);color:var(--ok-ink)}
@media (min-width:640px){.steps li span{display:inline}}

/* ---------- forms ---------- */
label.fld{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:800}
input[type=text],input[type=email],input[type=tel],input[type=password]{
  width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);
  font:600 15px 'Manrope',sans-serif;color:var(--ink);background:rgba(255,255,255,.7);
  transition:border-color .25s,box-shadow .25s,background .25s;
}
input::placeholder{color:#9DB0BB;font-weight:500}
input:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(176,93,120,.16)}
input[readonly]{background:rgba(23,50,65,.05);color:var(--muted)}

/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:none;border-radius:var(--r-sm);padding:15px 18px;font:800 15px 'Manrope',sans-serif;letter-spacing:.01em;cursor:pointer;text-align:center;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s var(--ease),filter .25s,background .25s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--ease)}
.btn:hover::after{transform:translateX(120%)}
.btn-navy{color:#fff;background:var(--grad);box-shadow:0 12px 26px -10px rgba(57,54,61,.7),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-navy:hover{transform:translateY(-2px);box-shadow:0 16px 30px -10px rgba(57,54,61,.75),inset 0 1px 0 rgba(255,255,255,.3)}
.btn:active{transform:translateY(0) scale(.98)}
.btn[disabled]{opacity:.7;cursor:progress;transform:none}
.btn-ghost{color:var(--brand-d);background:rgba(255,255,255,.65);border:1.5px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn-ghost:hover{transform:translateY(-2px);background:#fff;border-color:var(--brand)}
.btn-danger{color:var(--bad-ink);background:var(--bad-bg);border:1.5px solid rgba(226,92,92,.25)}
.btn-danger:hover{transform:translateY(-2px);background:rgba(226,92,92,.22)}
.btn-ok{color:#fff;background:linear-gradient(135deg,#27B084,#17694B);box-shadow:0 12px 26px -10px rgba(23,105,75,.7)}
.btn-ok:hover{transform:translateY(-2px)}
.link{background:none;border:none;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;transition:color .2s}
.link:hover{color:var(--brand)}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-top-color:transparent;border-radius:99px;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- misc components ---------- */
.infobox{display:flex;gap:10px;align-items:flex-start;background:rgba(176,93,120,.09);border:1px solid rgba(176,93,120,.16);color:var(--brand-d);border-radius:var(--r-sm);padding:12px 14px;font-size:12.5px;font-weight:600;margin-top:14px}
.infobox .i{margin-top:2px;color:var(--brand)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.03em;padding:6px 12px;border-radius:99px}
.badge.member{background:var(--ok-bg);color:var(--ok-ink)}
.badge.guest{background:rgba(23,50,65,.07);color:var(--ink-2)}
.badge.p{background:var(--warn-bg);color:var(--warn-ink)}
.badge.c{background:var(--ok-bg);color:var(--ok-ink)}
.err{display:none;background:var(--bad-bg);border:1px solid rgba(226,92,92,.25);color:var(--bad-ink);border-radius:var(--r-sm);padding:11px 14px;font-size:13px;font-weight:700;margin-top:12px;animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* ---------- calendar ---------- */
.calnav{display:flex;align-items:center;gap:8px;margin:10px 0 2px}
.calnav .today{flex:1;text-align:center;font-weight:800;font-size:13px;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px;cursor:pointer;color:var(--brand-d);background:rgba(255,255,255,.55);transition:all .25s var(--ease)}
.calnav .today:hover{background:#fff;border-color:var(--brand)}
.calnav button{display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);border:1.5px solid var(--line);color:var(--brand-d);width:44px;height:41px;border-radius:var(--r-sm);cursor:pointer;transition:all .25s var(--ease)}
.calnav button:hover{background:#fff;border-color:var(--brand);transform:translateY(-1px)}
.calnav button:active{transform:scale(.94)}
.calLabel{font-family:var(--serif);font-weight:600;text-align:center;margin:12px 0 10px;font-size:19px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.1em}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:6px}
.days.swap{animation:fade .35s var(--ease)}
.day{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:14px;font-weight:700;cursor:pointer;color:var(--ink);transition:transform .25s var(--ease),background .25s,box-shadow .25s,color .25s}
.day:not(.off):not(.empty):hover{background:rgba(176,93,120,.14);transform:scale(1.1)}
.day:not(.off):not(.sel):not(.empty):active{transform:scale(.92)}
.day.empty{cursor:default}
.day.off{color:#BFCBD2;cursor:default;font-weight:600}
.day.now:not(.sel){box-shadow:inset 0 0 0 1.5px var(--brand);color:var(--brand-d)}
.day.sel{background:var(--grad);color:#fff;box-shadow:0 10px 20px -8px rgba(57,54,61,.8);transform:scale(1.06)}

/* ---------- legend + availability grid ---------- */
.legend{display:grid;grid-template-columns:1fr 1fr;gap:12px 8px}
.legend .lg{display:flex;gap:10px;align-items:center}
.legend .sq{width:22px;height:22px;border-radius:8px;flex:none}
.legend b{font-size:13px;display:block;font-weight:800}
.legend small{color:var(--muted);font-size:11px;font-weight:600}
.gridwrap{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r-md);background:rgba(255,255,255,.35);border:1px solid var(--line);max-height:66vh}
table.grid{border-collapse:separate;border-spacing:5px;width:max-content;min-width:100%}
table.grid th,table.grid td{text-align:center;font-size:11.5px;white-space:nowrap;border-radius:11px}
table.grid thead th{position:sticky;top:0;z-index:3;padding:11px 12px;font-weight:800;color:var(--brand-d);letter-spacing:.02em;background:rgba(240,248,249,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
table.grid th.tcol,table.grid td.tcol{position:sticky;left:0;z-index:2;padding:8px 12px;font-weight:800;color:var(--ink-2);background:rgba(240,248,249,.92)}
table.grid thead th.tcol{z-index:4}
.skel{height:38px;border-radius:12px;margin:8px 0;background:linear-gradient(100deg,rgba(255,255,255,.35) 30%,rgba(255,255,255,.9) 50%,rgba(255,255,255,.35) 70%);background-size:300% 100%;animation:shimmer 1.3s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:92px;z-index:200;transform:translate(-50%,24px);opacity:0;pointer-events:none;background:rgba(23,50,65,.92);color:#fff;padding:12px 20px;border-radius:99px;font-size:13px;font-weight:700;box-shadow:0 14px 34px -10px rgba(23,50,65,.6);transition:all .45s var(--ease);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:#B0363A}

/* ---------- modal / sheet ---------- */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,30,44,.38);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility .35s}
.overlay.on{opacity:1;visibility:visible}
.sheet{width:100%;max-width:520px;padding:24px 22px 28px;border-radius:30px 30px 0 0;background:rgba(255,255,255,.86);transform:translateY(60px) scale(.98);transition:transform .5s var(--ease)}
.overlay.on .sheet{transform:none}
@media (min-width:768px){.overlay{align-items:center}.sheet{border-radius:30px;margin-bottom:0}}

/* ---------- dashboard components (Admin + Owner) ---------- */
  /* PIN gate */
  .gate{max-width:400px;margin:12vh auto 0;text-align:center;padding:34px 26px 28px}
  .gate .lockic{width:66px;height:66px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--grad);box-shadow:0 16px 28px -12px rgba(57,54,61,.8)}
  .gate .lockic .i{width:28px;height:28px}
  .gate h2{font-size:26px}
  .gate input{text-align:center;font-size:22px;letter-spacing:.4em;padding:15px}
  .gate input::placeholder{letter-spacing:.3em}

  /* stats */
  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .stat{position:relative;overflow:hidden;padding:16px 12px 14px;border-radius:var(--r-md);text-align:center;transition:transform .35s var(--ease)}
  .stat:hover{transform:translateY(-3px)}
  .stat .ico{width:34px;height:34px;margin:0 auto 8px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .stat.c .ico{background:var(--ok-bg);color:var(--ok-ink)}
  .stat.p .ico{background:var(--warn-bg);color:var(--warn-ink)}
  .stat.r .ico{background:rgba(176,93,120,.14);color:var(--brand-d)}
  .stat b{display:block;font-family:var(--serif);font-weight:700;font-size:26px;line-height:1.1}
  .stat small{color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}

  .cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .cardhead h3{font-family:var(--serif);font-size:20px;font-weight:600}
  .rfr{display:inline-flex;align-items:center;gap:7px;background:rgba(176,93,120,.12);border:none;color:var(--brand-d);font-weight:800;font-size:12.5px;padding:9px 14px;border-radius:12px;cursor:pointer;transition:all .25s var(--ease)}
  .rfr:hover{background:rgba(176,93,120,.22)}
  .rfr.spinning .i{animation:sp .7s linear infinite}

  /* schedule grid */
  td.cell{padding:11px 12px;min-width:124px;vertical-align:middle;font-weight:700}
  td.open{background:var(--past-bg);color:#B4C2CA;font-weight:700;font-size:11px}
  td.pend{background:var(--warn-bg)}
  td.conf{background:var(--ok-bg)}
  td.book{cursor:pointer;vertical-align:middle;transition:transform .25s var(--ease),box-shadow .25s}
  td.book:hover{transform:scale(1.03);box-shadow:0 12px 20px -10px rgba(23,50,65,.45)}
  .bk .nm{font-weight:800;font-size:12.5px;line-height:1.25}
  .bk .st{font-size:9.5px;font-weight:800;letter-spacing:.1em;margin-top:3px}
  .bk .st.p{color:var(--warn-ink)} .bk .st.c{color:var(--ok-ink)}
  .legend2{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;margin:14px 2px 0;color:var(--muted);font-weight:700}
  .legend2 span{display:flex;align-items:center;gap:7px}
  .legend2 i{width:14px;height:14px;border-radius:5px;display:inline-block}

  /* detail sheet */
  .sheet h3{font-family:var(--serif);font-size:26px;font-weight:600;margin-bottom:8px}
  .drow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;font-size:14px;border-bottom:1px dashed var(--line-2)}
  .drow:last-of-type{border:none}
  .drow span{color:var(--muted);font-weight:700}
  .drow b{text-align:right;font-weight:800}
  a.calllink{color:var(--brand-d);text-decoration:none;font-weight:800}
  a.calllink:hover{text-decoration:underline}
  .sheet .btn{margin-top:10px}
  .sheet .total b{font-family:var(--serif);font-size:22px;color:var(--brand-d)}

  /* confirm dialog + receipt */
  #cfOverlay{z-index:120;align-items:center}
  #cfOverlay .sheet{max-width:380px;border-radius:28px;text-align:center;padding:28px 24px 24px}
  #cfOverlay .warnic{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bad-bg);color:var(--bad-ink)}
  #cfOverlay .warnic .i{width:26px;height:26px}
  #cfOverlay p{color:var(--ink-2);font-size:14px;margin:8px 0 6px}
  .rcpt{align-items:center;z-index:110}
  .rcptBox{position:relative;border-radius:26px;padding:14px;max-width:92%;max-height:88vh;overflow:auto;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border:1px solid var(--glass-edge);box-shadow:var(--shadow);transform:scale(.94);transition:transform .5s var(--ease)}
  .rcpt.on .rcptBox{transform:none}
  .rcptX{position:absolute;top:10px;right:10px;display:flex;align-items:center;justify-content:center;background:rgba(23,50,65,.75);color:#fff;border:none;width:36px;height:36px;border-radius:50%;cursor:pointer;z-index:2;transition:transform .25s var(--ease)}
  .rcptX:hover{transform:rotate(90deg)}
  .rcptImg{display:none;max-width:100%;max-height:78vh;border-radius:16px;animation:fade .5s}
  .rcptMsg{padding:40px 30px;text-align:center;color:var(--muted);font-weight:700}

@media (min-width:768px){
  td.cell{min-width:160px}
  .stat b{font-size:32px}
}
input[type=number],input[type=date],input[type=time]{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:var(--r-sm);font:600 15px 'Manrope',sans-serif;color:var(--ink);background:rgba(255,255,255,.7);transition:border-color .25s,box-shadow .25s,background .25s}
input[type=number]:focus,input[type=date]:focus,input[type=time]:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(176,93,120,.16)}
</style>
<script>
/* Shared UI helpers: icon sprite, icon(), toast(), fx(), esc() */
var SP_SPRITE='<svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">'+
'<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 9.5h18"/></symbol>'+
'<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>'+
'<symbol id="i-court" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M12 5v14M3 12h18"/></symbol>'+
'<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></symbol>'+
'<symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>'+
'<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v2.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V16"/></symbol>'+
'<symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>'+

document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.innerHTML=SP_SPRITE;document.body.insertBefore(d.firstChild,document.body.firstChild);});
function ic(n,c){return '<svg class="i '+(c||'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>';}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fx(n){if(!n)return;n.classList.remove('fx');void n.offsetWidth;n.classList.add('fx');}
function toast(msg,kind){
  var t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t);}
  t.textContent=msg;t.className='toast on '+(kind||'');
  clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('on');},2600);
}
</script>

<body><script>(function(){var D=new Date(),p=function(n){return('0'+n).slice(-2)};
var cfg={businessName:'Salt & Paddle',tagline:'Book a court fast and easy',courts:[{id:'C1',name:'Court 1'},{id:'C2',name:'Court 2'}],
slots:[].concat(Array.from({length:18},function(_,i){var h=6+i;return{start:p(h)+':00',end:p(h+1)+':00',label:h+'-'+(h+1)}})),
tiers:[{start:'06:00',end:'15:59',rate:300},{start:'16:00',end:'23:59',rate:350}],membershipEnabled:true,memberRateType:'PERCENT',memberRateValue:10,salePct:0,saleStart:'',saleEnd:'',
contactNumber:'(0968) 694 3759',mapsLink:'https://maps.google.com',address:'New Covered Court, Sitio Suba, Brgy. Tuyan, Naga City',facebook:'https://fb.com',instagram:'',logoUrl:'',heroUrl:'',webUrl:'status-pending.html'};
var h={getPageConfig:function(){return cfg},checkEmail:function(e){return{member:/member/i.test(e),advanceDays:300}},
getAvailability:function(d){return{date:d,taken:{'C1|18:00':'Confirmed','C1|19:00':'Confirmed','C2|20:00':'Pending'}}},
getPaymentInfo:function(){return[{key:'GCash',label:'GCash',type:'wallet',number:'0908 694 ****',name:'JO*** M** A.',qr:''},{key:'Bank',label:'Bank Transfer',type:'bank',bankName:'GoTyme Bank',number:'******** 7068',name:'Jonnabelle Alesna',qr:''}]},
getDaySchedule:function(d,pin){if(pin!=='1234')return{ok:false};var c={};['18:00','19:00','20:00'].forEach(function(s){c['C1|'+s]={bookingId:'SP-001',name:'Victor Lapitan',contact:'9686943759',email:'v@x.com',start:'6:00 PM',end:'9:00 PM',courts:'Court 1',amount:1050,status:'Confirmed'}});c['C2|20:00']={bookingId:'SP-002',name:'Queenie Kate De Castro',contact:'9924497931',email:'q@x.com',start:'8:00 PM',end:'9:00 PM',courts:'Court 2',amount:350,status:'Pending'};return{ok:true,businessName:'Salt & Paddle',courts:cfg.courts,slots:cfg.slots,cells:c}},
getRates:function(pin){return pin==='1234'?{ok:true,tiers:cfg.tiers,membershipEnabled:true,memberType:'PERCENT',memberValue:10,salePct:0,saleStart:'',saleEnd:''}:{ok:false}},
getMembers:function(){return{ok:true,members:[{email:'maria@x.com',name:'Maria Santos',active:true},{email:'jun@x.com',name:'',active:false}]}},
addMember:function(){return{ok:true}},setMemberActive:function(){return{ok:true}},setTiers:function(){return{ok:true}},setMembership:function(){return{ok:true}},setSale:function(){return{ok:true}},
confirmFromDashboard:function(){return{ok:true}},cancelFromDashboard:function(){return{ok:true}},getReceiptDataUri:function(){return{ok:false,empty:true}},
submitBooking:function(){return{ok:true,bookingId:'SP-0001'}}};
function R(s,f){this.s=s;this.f=f}
Object.keys(h).forEach(function(k){R.prototype[k]=function(){var a=arguments,s=this.s;setTimeout(function(){s&&s(h[k].apply(null,a))},50)}});
R.prototype.withSuccessHandler=function(s){return new R(s,this.f)};R.prototype.withFailureHandler=function(f){return new R(this.s,f)};
window.google={script:{run:new R()}};})();
</script>
<div class="wrap">
  <header class="nav glass fx">
    <div class="brand">
      <div class="logo svg"><svg class="i"><use href="#i-paddle"/></svg></div>
      <div class="wordmark"><b id="hdr">Salt &amp; Paddle</b><span>ADMIN DASHBOARD</span></div>
    </div>
    <span class="tag" id="liveTag" style="display:none">LIVE</span>
  </header>

  <!-- PIN gate -->
  <div class="card gate fx d1" id="gate">
    <div class="lockic"><svg class="i"><use href="#i-lock"/></svg></div>
    <h2>Enter access PIN</h2>
    <p class="sub">This page is for the owner only.</p>
    <input type="password" id="pin" inputmode="numeric" placeholder="••••" autocomplete="off">
    <div class="err" id="gateErr"></div>
    <button class="btn btn-navy" id="enterBtn" style="margin-top:14px">Enter</button>
  </div>

  <!-- Dashboard -->
  <div id="dash" style="display:none">
    <div class="card fx d1">
      <div class="calnav"><button id="prevM" aria-label="Previous month"><svg class="i"><use href="#i-left"/></svg></button><div class="today" id="todayBtn">Today</div><button id="nextM" aria-label="Next month"><svg class="i"><use href="#i-right"/></svg></button></div>
      <div class="calLabel" id="calLabel"></div>
      <div class="dow"><span>SUN</span><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span></div>
      <div class="days" id="days"></div>
    </div>

    <div class="summary fx d2">
      <div class="stat glass c"><div class="ico"><svg class="i"><use href="#i-check"/></svg></div><b id="cntConf">0</b><small>Confirmed</small></div>
      <div class="stat glass p"><div class="ico"><svg class="i"><use href="#i-clock"/></svg></div><b id="cntPend">0</b><small>Pending</small></div>
      <div class="stat glass r"><div class="ico"><svg class="i"><use href="#i-peso"/></svg></div><b id="cntRev">₱0</b><small>Day total</small></div>
    </div>

    <div class="card fx d3">
      <div class="cardhead"><h3 id="dayTitle">Schedule</h3><button class="rfr" id="refreshBtn"><svg class="i"><use href="#i-refresh"/></svg>Refresh</button></div>
      <div class="gridwrap" id="gridwrap"></div>
      <div class="legend2"><span><i style="background:var(--ok-bg);border:1px solid rgba(34,170,120,.4)"></i>Confirmed</span><span><i style="background:var(--warn-bg);border:1px solid rgba(240,176,60,.5)"></i>Pending</span><span><i style="background:var(--past-bg);border:1px solid var(--line)"></i>Open</span></div>
    </div>
  </div>

<!-- detail sheet -->
<div class="overlay" id="overlay"><div class="sheet glass" id="sheet"></div></div>
<!-- receipt viewer -->
<div class="overlay rcpt" id="rcptOverlay"><div class="rcptBox"><button class="rcptX" onclick="closeRcpt()" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button><div id="rcptMsg" class="rcptMsg"></div><img id="rcptImg" class="rcptImg" alt="Receipt"></div></div>
<!-- confirm dialog -->
<div class="overlay" id="cfOverlay"><div class="sheet glass"><div class="warnic"><svg class="i"><use href="#i-info"/></svg></div><h3 id="cfTitle" style="font-size:24px">Are you sure?</h3><p id="cfMsg"></p><button class="btn btn-danger" id="cfOk" style="margin-top:14px">Yes</button><button class="btn btn-ghost" id="cfNo">Keep booking</button></div></div>

<script>
var PIN='',calY,calM,today=new Date();today.setHours(0,0,0,0);
var courts=[],slots=[],cells={},selDate=null,CURB=null;
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function el(id){return document.getElementById(id);}
function pad(n){return ('0'+n).slice(-2);}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pretty(ds){var p=ds.split('-'),d=new Date(p[0],p[1]-1,p[2]);var dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];return dn+', '+MONTHS[d.getMonth()].slice(0,3)+' '+(+p[2])+', '+p[0];}

el('enterBtn').onclick=function(){
  var p=el('pin').value.trim(),er=el('gateErr');
  function bad(m){er.style.animation='none';void er.offsetWidth;er.style.animation='';er.textContent=m;er.style.display='block';}
  if(!p){bad('Please enter your PIN.');return;}
  er.style.display='none';var btn=this;btn.innerHTML='<span class="spin"></span>Checking…';btn.disabled=true;
  selDate=ymd(today);
  google.script.run.withSuccessHandler(function(r){
    btn.innerHTML='Enter';btn.disabled=false;
    if(!r.ok){bad('Incorrect PIN. Please try again.');return;}
    PIN=p;el('gate').style.display='none';el('dash').style.display='block';el('liveTag').style.display='';
    ['dash'].forEach(function(i){fx(el(i));});
    if(r.businessName)el('hdr').textContent=r.businessName;
    calY=today.getFullYear();calM=today.getMonth();
    apply(r);renderCal();
  }).withFailureHandler(function(e){btn.innerHTML='Enter';btn.disabled=false;bad('Error: '+e.message);}).getDaySchedule(selDate,p);
};
el('pin').addEventListener('keydown',function(e){if(e.key==='Enter')el('enterBtn').click();});

function load(ds){
  selDate=ds;renderCal();
  var rb=el('refreshBtn');rb.classList.add('spinning');
  el('gridwrap').innerHTML='<div style="padding:12px"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>';
  google.script.run.withSuccessHandler(function(r){rb.classList.remove('spinning');if(r.ok&&ds===selDate)apply(r);else if(!r.ok){toast('Session expired. Please reload and enter your PIN again.','bad');}})
    .withFailureHandler(function(e){rb.classList.remove('spinning');toast('Could not load the schedule.','bad');}).getDaySchedule(ds,PIN);
}
function apply(r){courts=r.courts;slots=r.slots;cells=r.cells||{};renderGrid();}

function renderCal(){
  el('calLabel').textContent=MONTHS[calM]+' '+calY;
  var first=new Date(calY,calM,1).getDay(),dim=new Date(calY,calM+1,0).getDate(),html='';
  for(var i=0;i<first;i++)html+='<div class="day empty"></div>';
  for(var d=1;d<=dim;d++){var ds=calY+'-'+pad(calM+1)+'-'+pad(d);var s=(ds===selDate)?' sel':'';var now=(ds===ymd(today))?' now':'';html+='<div class="day'+s+now+'" data-d="'+ds+'">'+d+'</div>';}
  var dz=el('days');dz.innerHTML=html;dz.classList.remove('swap');void dz.offsetWidth;dz.classList.add('swap');
  dz.querySelectorAll('[data-d]').forEach(function(x){x.onclick=function(){load(this.getAttribute('data-d'));};});
}
el('prevM').onclick=function(){calM--;if(calM<0){calM=11;calY--;}renderCal();};
el('nextM').onclick=function(){calM++;if(calM>11){calM=0;calY++;}renderCal();};
el('todayBtn').onclick=function(){calY=today.getFullYear();calM=today.getMonth();load(ymd(today));};

function renderGrid(){
  el('dayTitle').textContent=pretty(selDate);
  // counts + revenue from distinct bookings
  var seen={},conf=0,pend=0,rev=0;
  Object.keys(cells).forEach(function(k){var b=cells[k];if(seen[b.bookingId])return;seen[b.bookingId]=1;if(b.status==='Confirmed')conf++;else pend++;rev+=Number(b.amount)||0;});
  el('cntConf').textContent=conf;el('cntPend').textContent=pend;el('cntRev').textContent='₱'+rev.toLocaleString();

  var n=slots.length;
  // build a plan so we can merge consecutive same-booking slots per court (rowspan)
  var plan=[];for(var i=0;i<n;i++){var rowp=[];for(var c=0;c<courts.length;c++)rowp.push(null);plan.push(rowp);}
  for(var c=0;c<courts.length;c++){
    var i=0;
    while(i<n){
      var key=courts[c].id+'|'+slots[i].start, b=cells[key];
      if(b){
        var j=i;
        while(j+1<n){var nx=cells[courts[c].id+'|'+slots[j+1].start];if(nx&&nx.bookingId===b.bookingId){j++;}else break;}
        plan[i][c]={type:'book',span:(j-i+1),info:b,key:key};
        for(var sps=i+1;sps<=j;sps++)plan[sps][c]={type:'skip'};
        i=j+1;
      } else { plan[i][c]={type:'open'};i++; }
    }
  }
  var h='<table class="grid"><thead><tr><th class="tcol">Time</th>';
  courts.forEach(function(co){h+='<th>'+esc(co.name)+'</th>';});
  h+='</tr></thead><tbody>';
  for(var r=0;r<n;r++){
    h+='<tr><td class="tcol">'+esc(slots[r].label)+'</td>';
    for(var c2=0;c2<courts.length;c2++){
      var p=plan[r][c2];
      if(!p||p.type==='skip')continue;
      if(p.type==='open'){h+='<td class="cell open">Open</td>';}
      else{var b2=p.info,cl=b2.status==='Confirmed'?'conf':'pend',st=b2.status==='Confirmed'?'c':'p';
        h+='<td class="cell book '+cl+'" rowspan="'+p.span+'" data-k="'+esc(p.key)+'"><div class="bk"><div class="nm">'+esc(b2.name)+'</div><div class="st '+st+'">'+esc(b2.status.toUpperCase())+'</div></div></td>';}
    }
    h+='</tr>';
  }
  h+='</tbody></table>';
  var gw=el('gridwrap');gw.innerHTML=h;fx(gw);
  gw.querySelectorAll('td.book').forEach(function(td){td.onclick=function(){detail(cells[this.getAttribute('data-k')]);};});
}

function detail(b){
  if(!b)return;
  CURB=b;
  var st=b.status==='Confirmed'?'c':'p';
  var btns='';
  if(b.status!=='Confirmed') btns+='<button class="btn btn-ok" id="confBtn" onclick="confirmDash()">'+ic('check')+'Confirm Booking</button>';
  btns+='<button class="btn btn-ghost" onclick="viewReceipt()">'+ic('receipt')+'View Receipt</button>';
  if(b.status!=='Cancelled') btns+='<button class="btn btn-danger" id="cancelBtn" onclick="cancelDash()">Cancel Booking</button>';
  btns+='<button class="btn btn-ghost" onclick="closeSheet()">Close</button>';
  el('sheet').innerHTML='<h3>'+esc(b.name)+'</h3><span class="badge '+st+'">'+esc(b.status.toUpperCase())+'</span>'+
    '<div style="margin-top:14px">'+
    drow('Booking ID',esc(b.bookingId))+
    drow('Time',esc(b.start)+' – '+esc(b.end))+
    drow('Courts',esc(b.courts))+
    drow('Contact','<a class="calllink" href="tel:'+esc(b.contact)+'">'+ic('phone')+' '+esc(b.contact)+'</a>')+
    drow('Email',esc(b.email))+
    '<div class="drow total"><span>Amount</span><b>₱'+Number(b.amount).toLocaleString()+'</b></div>'+
    '</div>'+btns;
  el('overlay').classList.add('on');
}
function confirmDash(){
  if(!CURB)return;
  var btn=el('confBtn');if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>Confirming…';}
  function reset(){if(btn){btn.disabled=false;btn.innerHTML=ic('check')+'Confirm Booking';}}
  google.script.run.withSuccessHandler(function(r){
    if(r&&r.ok){closeSheet();toast('Booking confirmed');load(selDate);}
    else{toast(r&&r.auth===false?'Session expired. Please reload and enter your PIN again.':'Could not confirm. Please try again.','bad');reset();}
  }).withFailureHandler(function(e){toast('Error: '+e.message,'bad');reset();}).confirmFromDashboard(CURB.bookingId,PIN);
}
function cancelDash(){
  if(!CURB)return;
  var b=CURB;
  askConfirm('Cancel this booking?','Cancel the booking for '+b.name+'? The slot will reopen for others. This cannot be undone.','Yes, cancel it',function(){
    var btn=el('cancelBtn');if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span>Cancelling…';}
    function reset(){if(btn){btn.disabled=false;btn.textContent='Cancel Booking';}}
    google.script.run.withSuccessHandler(function(r){
      if(r&&r.ok){closeSheet();toast('Booking cancelled');load(selDate);}
      else{toast(r&&r.auth===false?'Session expired. Please reload and enter your PIN again.':'Could not cancel. Please try again.','bad');reset();}
    }).withFailureHandler(function(e){toast('Error: '+e.message,'bad');reset();}).cancelFromDashboard(b.bookingId,PIN);
  });
}
function viewReceipt(){
  if(!CURB)return;
  el('rcptImg').style.display='none';el('rcptImg').src='';el('rcptMsg').innerHTML='<span class="spin" style="color:var(--brand);width:26px;height:26px"></span><div style="margin-top:12px">Loading receipt…</div>';el('rcptOverlay').classList.add('on');
  google.script.run.withSuccessHandler(function(r){
    if(r&&r.ok){el('rcptMsg').textContent='';el('rcptImg').src=r.dataUri;el('rcptImg').style.display='block';}
    else{el('rcptMsg').textContent=(r&&r.empty)?'No receipt was uploaded for this booking.':'Could not load the receipt.';}
  }).withFailureHandler(function(e){el('rcptMsg').textContent='Error loading receipt.';}).getReceiptDataUri(CURB.bookingId,PIN);
}
function closeRcpt(){el('rcptOverlay').classList.remove('on');}
function drow(a,b){return '<div class="drow"><span>'+a+'</span><b>'+b+'</b></div>';}
function closeSheet(){el('overlay').classList.remove('on');}

var CF_CB=null;
function askConfirm(title,msg,okLabel,cb){el('cfTitle').textContent=title;el('cfMsg').textContent=msg;el('cfOk').textContent=okLabel;CF_CB=cb;el('cfOverlay').classList.add('on');}
function closeConfirm(){el('cfOverlay').classList.remove('on');CF_CB=null;}
el('cfOk').onclick=function(){var cb=CF_CB;closeConfirm();if(cb)cb();};
el('cfNo').onclick=closeConfirm;
el('cfOverlay').onclick=function(e){if(e.target===this)closeConfirm();};

el('overlay').onclick=function(e){if(e.target===this)closeSheet();};
el('rcptOverlay').onclick=function(e){if(e.target===this)closeRcpt();};
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeConfirm();closeRcpt();closeSheet();}});
el('refreshBtn').onclick=function(){if(selDate&&PIN)load(selDate);};
</script>
