<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<?!= include('Styles') ?>
<style>
  .wrap{max-width:460px;margin:0 auto;padding:12px 14px 50px;min-height:100vh}
  .top2{display:flex;align-items:center;gap:10px;padding:22px 0 4px}
  .hback{display:flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:rgba(255,255,255,.7);color:var(--brand-d);text-decoration:none;transition:all .25s var(--ease)}
  .hback:hover{background:#fff;transform:translateX(-3px)}
  .top2 h2{flex:1;font-size:26px}
  .backbtn{margin-top:16px}

  .idrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .idrow .lbl{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--muted)}
  .idrow .id{font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:.03em}
  .cpy{display:inline-flex;align-items:center;gap:7px;background:rgba(176,93,120,.12);border:none;color:var(--brand-d);font-weight:800;padding:10px 15px;border-radius:12px;cursor:pointer;font-size:13px;transition:all .25s var(--ease)}
  .cpy:hover{background:rgba(176,93,120,.22);transform:translateY(-1px)}
  .center{text-align:center}
  .ic{width:78px;height:78px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
  .ic .i{width:34px;height:34px;stroke-width:2.2}
  .ic.pend{background:var(--warn-bg);color:var(--warn-ink)}
  .ic.pend::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(240,176,60,.45);animation:ring 2s ease-out infinite}
  @keyframes ring{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
  .ic.good{background:var(--ok-bg);color:var(--ok-ink)}
  .badge2{font-weight:800;font-size:13px;letter-spacing:.2em}
  .badge2.pend{color:var(--warn-ink)}.badge2.good{color:var(--ok-ink)}
  .tlabel{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--muted);margin-top:20px}
  .timer{display:flex;justify-content:center;align-items:flex-start;gap:8px;margin:12px 0 4px}
  .seg{min-width:78px;padding:14px 8px 10px;border-radius:var(--r-md);background:rgba(255,255,255,.7);border:1px solid var(--glass-edge);box-shadow:0 12px 24px -14px rgba(23,50,65,.4)}
  .seg b{display:block;font-family:var(--serif);font-weight:700;font-size:38px;line-height:1;color:var(--warn-ink);font-variant-numeric:tabular-nums}
  .seg small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.16em;font-weight:800;margin-top:6px}
  .colon{font-family:var(--serif);font-weight:700;font-size:30px;color:var(--warn-ink);padding-top:14px;animation:blink 1s steps(2,jump-none) infinite}
  @keyframes blink{50%{opacity:.25}}
  .timer.done .seg b,.timer.done .colon{color:var(--muted);animation:none}
  .notebox{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-sm);padding:13px 15px;font-size:13px;font-weight:600;margin-top:16px;text-align:left}
  .nb-amber{background:var(--warn-bg);color:var(--warn-ink)}
  .nb-blue{background:rgba(176,93,120,.1);color:var(--brand-d)}
  .nb-grey{background:rgba(23,50,65,.06);color:var(--ink-2)}
  .notebox .i{margin-top:2px;flex:none}
  .callbox{display:none;margin-top:16px;padding:18px;border-radius:var(--r-md);text-align:center;color:#fff;background:var(--grad);box-shadow:0 16px 30px -14px rgba(57,54,61,.8);animation:rise .5s var(--ease) both}
  .callbox .lbl{font-size:12.5px;color:#E6DDEA;font-weight:600}
  .callbox a{color:#fff;text-decoration:none;font-family:var(--serif);font-weight:700;font-size:28px;display:inline-block;margin-top:4px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;font-size:14px;font-weight:600}
  .row > span:first-child{display:flex;align-items:center;gap:9px;color:var(--ink-2)}
  .row > span:first-child .i{color:var(--brand)}
  .row.div{border-top:1px dashed var(--line-2);margin-top:6px;padding-top:14px}
  .row .amt{font-family:var(--serif);font-weight:700;color:var(--brand-d);font-size:22px}
  .thanks{margin-top:16px;padding:16px;text-align:center;color:var(--ok-ink);font-weight:800;border-radius:var(--r-md);background:var(--ok-bg);border:1px solid rgba(34,170,120,.25)}
  .refresh{margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header class="nav glass fx">
    <div class="brand">
      <div class="logo svg"><svg class="i"><use href="#i-paddle"/></svg></div>
      <div class="wordmark"><b>Booking Status</b><span>TRACK YOUR RESERVATION</span></div>
    </div>
  </header>
  <div class="top2"><a class="hback" href="<?!= homeUrl ?>" target="_top" aria-label="Back"><svg class="i"><use href="#i-left"/></svg></a><h2>Your Booking</h2></div>
  <div id="content"></div>
  <a class="btn btn-ghost backbtn" href="<?!= homeUrl ?>" target="_top"><svg class="i"><use href="#i-left"/></svg>Back to booking page</a>
</div>

<!-- Booking data is injected here as plain JSON text (never executed as code) -->
<script id="bookingData" type="application/json"><?!= dataJson ?></script>

<script>
var DATA=null,tick=null;
try { DATA = JSON.parse(document.getElementById('bookingData').textContent.trim()); } catch(e){ DATA=null; }

function pad(n){return ('0'+n).slice(-2);}
function el(id){return document.getElementById(id);}
function summary(d){
  var rows='';
  (d.schedule||[]).forEach(function(s){
    rows+='<div class="row"><span>'+ic('cal')+esc(s.date)+'</span><b>'+esc(s.time)+'</b></div>'+
      '<div class="row"><span style="padding-left:26px;font-size:13px">'+esc(s.courts)+'</span><b></b></div>';
  });
  rows+='<div class="row div"><span>Total hours</span><b>'+esc(d.hours)+' hours</b></div>'+
    '<div class="row"><span>Total amount</span><span class="amt">₱'+Number(d.amount).toLocaleString()+'</span></div>';
  return rows;
}
function idCard(d){return '<div class="card fx"><div class="idrow"><div><div class="lbl">BOOKING ID</div><div class="id">'+esc(d.bookingId)+'</div></div><button class="cpy" data-id="'+esc(d.bookingId)+'">'+ic('copy')+'Copy</button></div></div>';}
function bindCopy(){var b=document.querySelector('.cpy');if(b)b.onclick=function(){try{navigator.clipboard.writeText(this.getAttribute('data-id'));toast('Booking ID copied');}catch(e){}};}

function render(){
  var d=DATA;
  if(!d||!d.ok){el('content').innerHTML='<div class="card center fx"><p class="sub">Booking not found. Please check your link or refresh.</p><button class="btn btn-ghost" onclick="location.reload()">'+ic('refresh')+'Refresh</button></div>';return;}
  if(d.status==='Confirmed'){
    if(tick)clearInterval(tick);
    el('content').innerHTML=idCard(d)+
      '<div class="card center fx d1"><div class="ic good">'+ic('check')+'</div><div class="badge2 good">CONFIRMED</div><p style="margin:10px 0 0;font-weight:600">Your booking is confirmed.</p></div>'+
      '<div class="card fx d2"><h3 style="font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:6px">Booking details</h3>'+summary(d)+'</div>'+
      '<div class="thanks fx d3">See you on the court! Play hard, have fun.</div>';
    bindCopy();
    return;
  }
  el('content').innerHTML=idCard(d)+
    '<div class="card center fx d1"><div class="ic pend">'+ic('clock')+'</div><div class="badge2 pend">PENDING</div><p style="margin:8px 0 0;font-weight:600">Your slot is on hold.</p>'+
    '<div class="tlabel">TIME REMAINING</div>'+
    '<div class="timer" id="timer"><div class="seg"><b id="th">00</b><small>HRS</small></div><div class="colon">:</div><div class="seg"><b id="tm">00</b><small>MINS</small></div><div class="colon">:</div><div class="seg"><b id="ts">00</b><small>SECS</small></div></div>'+
    '<div class="notebox nb-amber" id="tmsg">'+ic('info')+'<span>If you still haven\'t received a confirmation in the time above, please contact us.</span></div>'+
    '<div class="callbox" id="callbox"><div class="lbl">Time\'s up — you can now contact us:</div><a id="callnum" href="#">'+esc(d.contactNumber||'')+'</a></div></div>'+
    '<div class="card fx d2"><h3 style="font-family:var(--serif);font-size:20px;font-weight:600;margin-bottom:6px">Booking details</h3>'+summary(d)+'</div>'+
    '<div class="notebox nb-grey fx d3">'+ic('lock')+'<span>We\'ll confirm your booking shortly after verifying your payment. Your slot is not automatically released.</span></div>'+
    '<div class="notebox nb-blue fx d3"><svg class="i"><use href="#i-info"/></svg><span><b>Need help?</b> Your contact number will be shown when the timer reaches zero.</span></div>'+
    '<button class="btn btn-ghost refresh" onclick="location.reload()">'+ic('refresh')+'Refresh status</button>';
  bindCopy();
  startTimer();
}
function startTimer(){
  if(tick)clearInterval(tick);
  var end=DATA.submittedAt+DATA.confirmWindowMin*60000;
  function upd(){
    var rem=end-Date.now(),t=el('timer');if(!t)return;
    if(rem<=0){el('th').textContent='00';el('tm').textContent='00';el('ts').textContent='00';t.className='timer done';
      var cb=el('callbox');if(cb&&DATA.contactNumber){cb.style.display='block';el('callnum').href='tel:'+DATA.contactNumber;}
      var tm=el('tmsg');if(tm)tm.style.display='none';return;}
    var h=Math.floor(rem/3600000),m=Math.floor((rem%3600000)/60000),s=Math.floor((rem%60000)/1000);
    el('th').textContent=pad(h);el('tm').textContent=pad(m);el('ts').textContent=pad(s);
  }
  upd();tick=setInterval(upd,1000);
}
try { render(); } catch(e){
  el('content').innerHTML='<div class="card center"><p class="sub">Couldn\'t display this booking. Please tap refresh.</p><button class="btn btn-ghost" onclick="location.reload()">Refresh</button></div>';
}
</script>
</body>
</html>
