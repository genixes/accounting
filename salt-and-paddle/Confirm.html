<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<?!= include('Styles') ?>
<style>
  .wrap{max-width:460px;margin:0 auto;padding:12px 14px 50px;min-height:100vh}
  .res{text-align:center;padding:34px 22px 26px}
  .ic{width:96px;height:96px;margin:0 auto 16px;position:relative}
  .ic::before{content:"";position:absolute;inset:-10px;border-radius:50%;animation:halo 2.4s ease-in-out infinite}
  .ic.good::before{background:radial-gradient(circle,rgba(34,170,120,.35),transparent 70%)}
  .ic.bad::before{background:radial-gradient(circle,rgba(226,92,92,.35),transparent 70%)}
  @keyframes halo{50%{transform:scale(1.18);opacity:.5}}
  .ic svg{position:relative;width:100%;height:100%;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .ic .c{stroke-width:2.5;stroke-dasharray:152;stroke-dashoffset:152;animation:draw .8s .1s var(--ease) forwards}
  .ic .p{stroke-width:3.5;stroke-dasharray:44;stroke-dashoffset:44;animation:draw .5s .7s var(--ease) forwards}
  .ic.good .c{stroke:#27B084}.ic.good .p{stroke:#17694B}
  .ic.bad .c{stroke:#E25C5C}.ic.bad .p{stroke:#B0363A}
  @keyframes draw{to{stroke-dashoffset:0}}
  .res h2{font-size:30px}
  .det{margin-top:22px;text-align:left}
  .row{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:11px 0;font-size:14px;border-bottom:1px dashed var(--line-2)}
  .row:last-child{border:none}
  .row > span{color:var(--muted);font-weight:700}
  .row b{text-align:right;font-weight:800}
  .row.sub2 span{padding-left:14px;font-size:13px}
  .row .amt{font-family:var(--serif);font-weight:700;color:var(--brand-d);font-size:24px}
</style>
</head>
<body>
<div class="wrap">
  <header class="nav glass fx">
    <div class="brand">
      <div class="logo svg"><svg class="i"><use href="#i-paddle"/></svg></div>
      <div class="wordmark"><b>Booking</b><span>OWNER CONFIRMATION</span></div>
    </div>
  </header>
<? if (res.ok) { ?>
  <div class="card res fx d1">
    <div class="ic good"><svg viewBox="0 0 52 52"><circle class="c" cx="26" cy="26" r="24"/><path class="p" d="M15 27l7.5 7.5L38 18.5"/></svg></div>
    <? if (res.already) { ?>
      <h2>Already Confirmed</h2><p class="sub" style="margin-top:10px">This booking was already confirmed.</p>
    <? } else { ?>
      <h2>Booking Confirmed</h2><p class="sub" style="margin-top:10px">The booker has been notified by email.</p>
    <? } ?>
    <div class="det">
      <div class="row"><span>Booking ID</span><b><?= res.row['Booking ID'] ?></b></div>
      <div class="row"><span>Name</span><b><?= res.row['Booker Name'] ?></b></div>
      <? for (var i = 0; i < res.schedule.length; i++) { ?>
      <div class="row"><span><?= res.schedule[i].date ?></span><b><?= res.schedule[i].time ?></b></div>
      <div class="row sub2"><span><?= res.schedule[i].courts ?></span><b></b></div>
      <? } ?>
      <div class="row"><span>Total</span><span class="amt">₱<?= res.row['Amount'] ?></span></div>
    </div>
  </div>
<? } else { ?>
  <div class="card res fx d1">
    <div class="ic bad"><svg viewBox="0 0 52 52"><circle class="c" cx="26" cy="26" r="24"/><path class="p" d="M18 18l16 16M34 18L18 34"/></svg></div>
    <h2>Cannot Confirm</h2><p class="sub" style="margin-top:10px"><?= res.msg ?></p>
  </div>
<? } ?>
</div>
</body>
</html>
