/* -------------------------------- State -------------------------------- */

/* ----------------------- Business rules (mirror server) --------------------- */
function effect(type, source, qty) {
  var q = Number(qty) || 0, fc = source === 'Consignment';
  switch (type) {
    case 'Sample': return { hand: -q, consign: 0 };
    case 'Consignment': return { hand: -q, consign: q };
    case 'Sale': return fc ? { hand: 0, consign: -q } : { hand: -q, consign: 0 };
    case 'Return': return { hand: q, consign: -q };
    case 'Pullout': return fc ? { hand: 0, consign: -q } : { hand: -q, consign: 0 };
    case 'Adjustment': return { hand: q, consign: 0 };
    default: return { hand: 0, consign: 0 };
  }
}
function normSource(type, source) { if (type === 'Return') return 'Consignment'; if (type === 'Sale' || type === 'Pullout') return source === 'Consignment' ? 'Consignment' : 'Hand'; return 'Hand'; }

var BUCKETS = [
  { k: 'expired', label: 'Expired', tone: 'red' }, { k: 'b30', label: '0–30 days', tone: 'red' }, { k: 'b60', label: '31–60 days', tone: 'amber' },

];
function toneOf(days) { return days < 0 || days <= 30 ? 'red' : days <= 90 ? 'amber' : days <= 180 ? 'blue' : 'green'; }
function statusOf(days, stock, last) { if (stock <= 0) return last === 'Pullout' ? 'Pulled Out' : 'Depleted'; if (days < 0) return 'Expired'; return days <= 180 ? 'Near Expiry' : 'Active'; }
function pillHtml(days) {
  var t = toneOf(days), txt;
  if (days < 0) txt = 'Expired ' + Math.abs(days) + 'd ago';
  else if (days === 0) txt = 'Expires today';
  else if (days <= 180) txt = days + (days === 1 ? ' day left' : ' days left');

}

/* ------------------------------ Server calls ------------------------------ */
function server(action, payload, timeoutMs) {
  return new Promise(function (resolve, reject) {
    var done = false;
    var timer = setTimeout(function () { if (!done) { done = true; reject(new Error('timeout')); } }, timeoutMs || (action === 'loadAll' ? 60000 : 100000));
    try {
      google.script.run
        .withSuccessHandler(function (r) {
          if (done) return; done = true; clearTimeout(timer);
          var o = null;
          try { o = typeof r === 'string' ? JSON.parse(r) : r; } catch (e) { reject(new Error('bad response')); return; }
          if (o && o.code === 'AUTH' && action !== 'login') { authLost(); reject(new Error('auth')); return; }
          if (o && o.code === 'CHANGE') { S.auth = { mode: 'change', msg: o.error }; renderAll(); reject(new Error('change')); return; }
          resolve(o || { ok: false, error: 'The server sent an empty answer. Please try again.' });
        })
        .withFailureHandler(function (e) { if (done) return; done = true; clearTimeout(timer); reject(e || new Error('failed')); })
        .api(action, payload ? JSON.stringify(payload) : '', S.token || '');
    } catch (e) { clearTimeout(timer); if (!done) { done = true; reject(e); } }
  });
}

/* ------------------------ Dataset, cache and index ------------------------- */
var TABLE_KEYS = { products: 'ProductID', batches: 'BatchID', deliveries: 'DeliveryID', accounts: 'AccountID', movements: 'MovementID', alerts: 'AlertID' };

  if (!ch || !S.data) return;
  Object.keys(TABLE_KEYS).forEach(function (t) { (ch[t] || []).forEach(function (o) { upsert(S.data[t], TABLE_KEYS[t], o); }); });
}
var persist = debounce(function () { if (S.data) store.set(uk('mt_cache_v1'), JSON.stringify({ data: S.data, flags: S.flags, ts: Date.now() })); }, 700);

function reindex() {
  var d = S.data, today = S.today;
  var I = { prod: {}, acc: {}, batch: {}, cons: {}, last: {}, agg: {}, list: [], byProd: {}, principals: [] };
  d.products.forEach(function (p) { I.prod[p.ProductID] = p; });
  d.accounts.forEach(function (a) { I.acc[a.AccountID] = a; });
  d.movements.forEach(function (m) {
    var e = effect(m.Type, m.Source || normSource(m.Type, ''), m.Qty);
    if (e.consign && m.AccountID) { var c = I.cons[m.BatchID] || (I.cons[m.BatchID] = {}); c[m.AccountID] = (c[m.AccountID] || 0) + e.consign; }
    I.last[m.BatchID] = m.Type;
  });
  var blank = { BrandName: '(removed product)', GenericName: '', Dosage: '', Form: '', PackSize: '', Principal: '', UnitCost: 0, SellingPrice: 0, ReorderLevel: 0, Active: false };
  d.batches.forEach(function (b) {
    var p = I.prod[b.ProductID] || blank, c = I.cons[b.BatchID] || {}, cons = 0, locs = [];
    Object.keys(c).forEach(function (k) { if (c[k] > 0) { cons += c[k]; locs.push({ accId: k, qty: c[k] }); } });
    var days = daysBetween(today, b.ExpiryDate), stock = b.QtyOnHand + cons;
    var o = { b: b, id: b.BatchID, p: p, pid: b.ProductID, lot: b.LotNumber, expiry: b.ExpiryDate, days: days, hand: b.QtyOnHand, cons: cons, stock: stock, locs: locs,
      bucket: stock > 0 ? bucketOf(days) : 'none', st: statusOf(days, stock, I.last[b.BatchID]),
      sx: (p.BrandName + ' ' + p.GenericName + ' ' + b.LotNumber + ' ' + p.Dosage).toLowerCase() };
    I.batch[o.id] = o; I.list.push(o);

  I.list.sort(function (a, b) { return a.expiry < b.expiry ? -1 : a.expiry > b.expiry ? 1 : (a.p.BrandName < b.p.BrandName ? -1 : 1); });
  var pr = {};
  I.list.forEach(function (o) {
    (I.byProd[o.pid] = I.byProd[o.pid] || []).push(o);
    var a = I.agg[o.pid] || (I.agg[o.pid] = { hand: 0, cons: 0, stock: 0, next: null, nextDays: null, cost: 0, sell: 0 });

}
function accName(id) { var a = S.idx.acc[id]; return a ? a.Name : '(unknown account)'; }
function prodTitle(p) { return p.BrandName + (p.Dosage ? ' ' + p.Dosage : ''); }
function consAt(o, accId) { return (S.idx.cons[o.id] || {})[accId] || 0; }
function whereText(o) {
  var parts = [];

  return parts.length ? parts.join(' · ') : 'No stock';
}

/* ------------------------- Local (optimistic) appliers ------------------------- */
var APPLY = {
  saveProduct: function (p) {
    var vals = { BrandName: p.brandName.trim(), GenericName: p.genericName.trim(), Dosage: (p.dosage || '').trim(), Form: (p.form || '').trim(), PackSize: (p.packSize || '').trim(), Principal: (p.principal || '').trim(), UnitCost: num(p.unitCost) || 0, SellingPrice: num(p.sellingPrice) || 0, ReorderLevel: num(p.reorderLevel) || 0 };
    var ex = findBy(S.data.products, 'ProductID', p.productId), now = nowISO();
    if (ex) { for (var k in vals) ex[k] = vals[k]; ex.UpdatedAt = now; }
    else { vals.ProductID = p.productId; vals.Active = true; vals.CreatedAt = now; vals.UpdatedAt = now; S.data.products.push(vals); }
  },
  setProductActive: function (p) { var ex = findBy(S.data.products, 'ProductID', p.productId); if (ex) ex.Active = !!p.active; },
  saveAccount: function (p) {
    var vals = { Name: p.name.trim(), Type: p.type, Address: (p.address || '').trim(), ContactPerson: (p.contactPerson || '').trim(), ContactNo: (p.contactNo || '').trim() };
    var ex = findBy(S.data.accounts, 'AccountID', p.accountId);
    if (ex) { for (var k in vals) ex[k] = vals[k]; } else { vals.AccountID = p.accountId; vals.Active = true; S.data.accounts.push(vals); }
  },
  setAccountActive: function (p) { var ex = findBy(S.data.accounts, 'AccountID', p.accountId); if (ex) ex.Active = !!p.active; },
  receiveDelivery: function (p) {
    if (findBy(S.data.deliveries, 'DeliveryID', p.deliveryId)) return;
    var now = nowISO();
    S.data.deliveries.push({ DeliveryID: p.deliveryId, DeliveryDate: p.deliveryDate, ReferenceNo: p.referenceNo || '', Notes: p.notes || '', CreatedAt: now, RequestID: p.requestId });
    p.lines.forEach(function (l) {
      var q = num(l.qty);
      S.data.batches.push({ BatchID: l.batchId, ProductID: l.productId, LotNumber: l.lotNumber.trim(), ExpiryDate: l.expiryDate, QtyReceived: q, QtyOnHand: q, DeliveryID: p.deliveryId, Status: 'Active', CreatedAt: now, UpdatedAt: now });
    });
  },
  recordMovement: function (p) {
    if (findBy(S.data.movements, 'MovementID', p.movementId)) return;
    var b = findBy(S.data.batches, 'BatchID', p.batchId); if (!b) return;
    var src = normSource(p.type, p.source), e = effect(p.type, src, num(p.qty));

    S.data.movements.push({ MovementID: p.movementId, Date: p.date, BatchID: p.batchId, AccountID: p.accountId || '', Type: p.type, Qty: num(p.qty), UnitPrice: num(p.unitPrice) || 0, Notes: p.notes || '', CreatedAt: nowISO(), RequestID: p.requestId, Source: src });
  }

/* ----------------------------- Offline queue ----------------------------- */
function saveQueue() { store.set(uk('mt_queue_v1'), JSON.stringify(S.queue)); store.set(uk('mt_failed_v1'), JSON.stringify(S.failed)); }
function loadQueue() {
  if (!MULTI && store.get('mt_queue_v1') && !store.get(uk('mt_queue_v1'))) { store.set(uk('mt_queue_v1'), store.get('mt_queue_v1')); store.del('mt_queue_v1'); }
  try { S.queue = JSON.parse(store.get(uk('mt_queue_v1')) || '[]') || []; } catch (e) { S.queue = []; }
  try { S.failed = JSON.parse(store.get(uk('mt_failed_v1')) || '[]') || []; } catch (e) { S.failed = []; }
}
function enqueue(item) { S.queue.push(item); saveQueue(); renderSyncBadge(); scheduleFlush(2500); }
function reapplyPending() { S.queue.forEach(function (it) { try { APPLY[it.action](it.payload); } catch (e) { /* ignore */ } }); }

/**
 * Applies a change instantly, then saves it. If the connection fails the entry stays in the
 * queue (localStorage) and is retried automatically. Returns {status: saved|queued|rejected, error}.
 */
function mutate(action, payload, label) {
  payload.requestId = payload.requestId || uid('REQ');
  APPLY[action](payload);
  reindex(); persist(); renderView(true); renderChrome();
  var item = { id: payload.requestId, action: action, payload: payload, label: label || action, ts: Date.now() };
  if (S.queue.length || !S.online) { enqueue(item); return Promise.resolve({ status: 'queued' }); }
  return server(action, payload).then(function (res) {
    if (res && res.ok) { mergeChanges(res.changes); reindex(); persist(); renderView(true); renderChrome(); return { status: 'saved', res: res }; }
    return refresh(true).then(function () { return { status: 'rejected', error: (res && res.error) || 'Could not save.' }; });
  }, function () { enqueue(item); return { status: 'queued' }; });
}
var flushTimer = null;
function scheduleFlush(ms) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }
function flush() {
  if (S.syncing || !S.online || !S.queue.length) return;
  S.syncing = true; renderSyncBadge();
  var hadReject = false, synced = 0;
  (function next() {
    var it = S.queue[0];
    if (!it) {
      S.syncing = false; renderSyncBadge();
      if (synced) { toast(synced === 1 ? 'Pending entry synced' : synced + ' pending entries synced', 'ok'); }
      if (hadReject) { toast('Some entries could not be saved. Tap the badge to review.', 'err'); refresh(true); }
      return;
    }
    server(it.action, it.payload).then(function (res) {
      S.queue.shift();
      if (res && res.ok) { mergeChanges(res.changes); synced++; }
      else { S.failed.push({ id: it.id, action: it.action, payload: it.payload, label: it.label, ts: it.ts, error: (res && res.error) || 'Could not save.' }); hadReject = true; }
      saveQueue(); reindex(); persist(); renderView(true); renderSyncBadge();
      next();
    }, function () { S.syncing = false; renderSyncBadge(); scheduleFlush(20000); });
  })();
}

/* -------------------------------- Loading -------------------------------- */
function applyLoaded(res, fromCache) {
  S.data = res.data; S.flags = res.flags || {}; S.today = todayYMD(); S.fromCache = !!fromCache;
  S.data.alerts = S.data.alerts || [];
  reapplyPending();
  reindex();
  savedBrand();
}
function refresh(silent) {
  if (!S.online) return Promise.resolve();

/** Splits pasted text (tab- or comma-separated, quotes allowed) into rows of cells. */
function parseDelimited(text) {
  var first = (text.split(/\r?\n/)[0] || ''), delim = first.indexOf('\t') >= 0 ? '\t' : (first.indexOf(';') >= 0 && first.indexOf(',') < 0 ? ';' : ',');

  for (var i = 0; i < text.length; i++) {
    var ch = text.charAt(i);

    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  row.push(cell); rows.push(row);
  return rows;
}

  if (!ok) return;
  if (!S.online) return toast('Creating an account needs a connection.', 'warn');
  setBusy(el, true, 'Creating (this takes a few seconds)');
  server('adminCreateUser', { name: name, email: email, role: val('nu_role') }, 120000).then(function (res) {
    setBusy(el, false);
    if (!res.ok) return setErr('nu_email', res.error);
    closeAllSheets(); credentialSheet('Account created', res.user.name, res.user.email, res.temp, res.url); loadUsers();
  }, function () { setBusy(el, false); toast('Could not reach the server. Check the Users list before trying again.', 'err'); });
};
A.openUser = function (el) {
  var u = (S.users || []).filter(function (x) { return x.uid === el.getAttribute('data-id'); })[0]; if (!u) return;
  var self = S.user && u.uid === S.user.uid;
  openSheet({ title: u.name, html: '<div class="card" style="box-shadow:none"><div class="pad" style="padding:6px 16px"><div class="kv"><span>Email</span><b>' + esc(u.email) + '</b></div><div class="kv"><span>Role</span><b>' + (u.role === 'Admin' ? 'Administrator' : 'Medrep') + '</b></div><div class="kv"><span>Status</span><b>' + (u.active ? 'Active' : 'Switched off') + '</b></div><div class="kv"><span>Last sign-in</span><b>' + (u.lastLogin ? esc(fmtDate(String(u.lastLogin).slice(0, 10))) : 'Never') + '</b></div></div></div>' + (u.sheetUrl ? '<p style="margin-top:12px"><a href="' + esc(u.sheetUrl) + '" target="_blank" rel="noopener noreferrer">Open their spreadsheet in Drive</a></p>' : ''),
    foot: '<button class="btn" data-a="resetUserPw" data-id="' + esc(u.uid) + '">Reset password</button>' + (self ? '' : '<button class="btn ' + (u.active ? 'danger' : 'primary') + '" data-a="toggleUser" data-id="' + esc(u.uid) + '">' + (u.active ? 'Switch off' : 'Switch on') + '</button>') });
};
A.resetUserPw = function (el) {
  var id = el.getAttribute('data-id'), u = (S.users || []).filter(function (x) { return x.uid === id; })[0];
  confirmSheet({ title: 'Reset password for ' + u.name + '?', intro: 'They will be signed out everywhere and must use a new temporary password.', ok: 'Reset password' }).then(function (yes) {
    if (!yes) return;
    server('adminResetPassword', { uid: id }).then(function (res) { if (!res.ok) return alertSheet('Could not reset', res.error); closeAllSheets(); credentialSheet('New temporary password', res.name, res.email, res.temp, res.url || S.flags.appUrl || ''); loadUsers(); }, function () { toast('Could not reach the server.', 'err'); });
  });
};
A.toggleUser = function (el) {
  var id = el.getAttribute('data-id'), u = (S.users || []).filter(function (x) { return x.uid === id; })[0];
  confirmSheet({ title: (u.active ? 'Switch off ' : 'Switch on ') + u.name + '?', intro: u.active ? 'They will be signed out and cannot sign in. Their data is kept.' : 'They can sign in again.', ok: u.active ? 'Switch off' : 'Switch on', tone: u.active ? 'danger' : 'primary' }).then(function (yes) {
    if (!yes) return;
    server('adminSetActive', { uid: id, active: !u.active }).then(function (res) { if (!res.ok) return alertSheet('Could not change', res.error); closeAllSheets(); toast('Saved', 'ok'); loadUsers(); }, function () { toast('Could not reach the server.', 'err'); });
  });
};

/* ------------------------------------ Boot ------------------------------------ */
/** Loads the saved copy of this user's data (instant start, works offline). */
function loadCache() {
  var cached = store.get(uk('mt_cache_v1'));
  if (!cached) return;
  try {
    var c = JSON.parse(cached);
    if (c && c.data) { S.data = c.data; S.flags = c.flags || {}; S.data.alerts = S.data.alerts || []; S.fromCache = true; S.loading = false; reapplyPending(); reindex(); savedBrand(); }
  } catch (e) { S.data = null; }
}
/** Starts a signed-in session: show saved data at once, then refresh and sync pending entries. */
function startSession() {
  loadQueue(); loadCache(); renderAll();
  if (S.online) refresh(true).then(flush);
  else if (!S.data) { S.loading = false; S.loadError = 'You are offline and no saved data is on this phone yet. Open MedTrack once with signal.'; renderAll(); }
}
function boot() {
  applyTheme(store.get('mt_theme') || 'auto');
  S.route = parseHash();
  if (MULTI) {
    if (RESET_TOKEN) { S.auth = { mode: 'reset', msg: '' }; renderAll(); return; }
    var tk = store.get('mt_token'), us = store.get('mt_user');
    if (tk && us) {
      try { S.user = JSON.parse(us); S.token = tk; S.uid = S.user.uid; } catch (e) { S.token = ''; }
    }
    if (!S.token) { S.auth = { mode: 'login', msg: '' }; renderAll(); return; }
    if (S.user.mustChange) { S.auth = { mode: 'change', msg: 'Please choose your own password to continue.' }; renderAll(); return; }
  }
  startSession();
  setInterval(function () { if (S.queue.length && S.online && (!MULTI || S.token)) flush(); }, 60000);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

})();
</script>
